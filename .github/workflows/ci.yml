name: Provera

# Svaki pull request i push: lint + build (tsc + vite). Ovaj repo se ne objavljuje sam na sajt;
# spojene izmene održavaoci prenose u produkciju (vidi CONTRIBUTING.md).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
